<section class="pt-5">
  <div class="form-container">
    <h2 class="text-center">Login</h2>
    <form [formGroup]="formGroup" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input
          id="loginEmail"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="email"
          [class.is-valid]="_email.valid && (_email.touched || _email.dirty)"
          [class.is-invalid]="_email.invalid && (_email.touched || _email.dirty)"
        />
        @if (_email.hasError('required') && _email.touched) {
          <span class="text-danger">Email is required.</span>
        } @else if (_email.hasError('email') && _email.touched) {
          <span class="text-danger">Enter a valid email address.</span>
        }
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          [class.is-valid]="_password.valid && (_password.touched || _password.dirty)"
          [class.is-invalid]="_password.invalid && (_password.touched || _password.dirty)"
        />
        @if (_password.hasError('required') && _password.touched) {
          <span class="text-danger">Password is required.</span>
        }
      </div>

      <div class="form-group">
        <button class="btn btn-info w-100" type="submit" [disabled]="formGroup.invalid || isSubmitting">
          @if (!isSubmitting) {
            Login <i class="fa fa-sign-in" aria-hidden="true"></i>
          } @else {
            Signing in...
          }
        </button>
      </div>

      <div class="form-group pt-3">
        <div class="d-flex justify-content-between align-items-center">
          <button type="button" class="btn btn-danger" routerLink="/account/register">
            Create account?
          </button>
          <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#forgetPasswordModal"
          >
            Forget password
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Forget password modal -->
  <div
    class="modal fade"
    id="forgetPasswordModal"
    tabindex="-1"
    aria-labelledby="forgetPasswordModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="forgetPasswordModalLabel">Forget password</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>
        <div class="modal-body">
          <label for="forgetPasswordEmail" class="form-label">Email</label>
          <input
            id="forgetPasswordEmail"
            type="email"
            placeholder="example@email.com"
            class="form-control"
            autocomplete="email"
            [(ngModel)]="emailModel"
          />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button
            type="button"
            (click)="SendEmailForgetpassword()"
            class="btn btn-primary"
            [disabled]="isSendingReset"
          >
            {{ isSendingReset ? 'Sending...' : 'Send' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
